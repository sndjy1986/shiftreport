<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Dispatch Ops Central</title>
    <script type="text/javascript">
      // GitHub Pages SPA 404 redirection
      var pathSegmentsToKeep = 0;
      var l = window.location;
      // If deployed in a project page (e.g. username.github.io/repo-name), detect repo name
      var pathParts = l.pathname.split('/').filter(Boolean);
      if (l.hostname.endsWith('.github.io') && pathParts.length > 0) {
        pathSegmentsToKeep = 1;
      }
      var repoBase = '/' + pathParts.slice(0, pathSegmentsToKeep).join('/');
      if (repoBase === '/') repoBase = '';
      var route = pathParts.slice(pathSegmentsToKeep).join('/');
      var target = repoBase + '/#/' + route + (l.search ? l.search : '') + (l.hash ? l.hash : '');
      window.location.replace(target);
    </script>
  </head>
  <body>
  </body>
</html>
